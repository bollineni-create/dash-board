/* A console home screen. The selected app sets the whole scene: its colour washes the
   background, its name and pitch fill the left, and on the right sits the app itself,
   already loaded and running, as a live card. Start zooms that card to full screen. */
:root {

  var fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  var root = document.documentElement;
  var shelfEl = document.getElementById('shelf'), dotsEl = document.getElementById('dots');
  var buttons = LIST.map(function (a, i) {
    var b = document.createElement('button'), ic = document.createElement('span'), img = document.createElement('img'), lbl = document.createElement('span');
    b.className = 'app'; b.type = 'button'; b.dataset.app = a.id; b.style.setProperty('--i', i);
    ic.className = 'icon'; img.src = a.icon; img.alt = ''; if (a.iconStyle) img.style.cssText = a.iconStyle;
    lbl.className = 'lbl'; lbl.textContent = a.name;
    ic.appendChild(img); b.append(ic, lbl); shelfEl.appendChild(b);
    return b;
  });
  var dots = LIST.map(function (a) {
    var d = document.createElement('button'); d.type = 'button'; d.tabIndex = -1; d.setAttribute('aria-label', a.name);
    d.addEventListener('click', function () { if (open && open !== a.id) switchTo(a.id); });
    dotsEl.appendChild(d); return d;
  });
  var $ = function (id) { return document.getElementById(id); };
  var win = $('win'), framesEl = $('frames'), splash = $('splash'), slot = $('slot');
  var cardHit = $('cardHit'), reflect = $('reflect'), heroEl = $('hero');
  var sel = null, open = null, busy = false, pushed = false;
  var DUR = 600;

  // Each app gets one iframe, made the first time it's needed and kept afterwards, so the
  // card shows the real app already running and Start only has to zoom it up.
  var frames = {};
  function warm(id) {
    if (frames[id] || !APPS[id]) return frames[id];
    var a = APPS[id], fr = { el: document.createElement('iframe'), loaded: false, waiters: [] };
    fr.el.title = a.name; fr.el.referrerPolicy = 'no-referrer'; fr.el.allow = 'clipboard-write';
    fr.el.tabIndex = -1;
    fr.el.addEventListener('load', function () {
      fr.loaded = true;
      if (sel === id) splash.classList.add('gone');

      if (!a.ownsEsc) try { fr.el.contentWindow.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !e.defaultPrevented && open === id) home(); }); } catch (err) { /* another origin */ }
    }, { once: true });

    framesEl.appendChild(fr.el);
    return (frames[id] = fr);
  }

  // The window's own size. Usually the screen; in split view (unfolded Duo and other small
  // tablets) the pane to the right of the folded rail, at its real size.
  var splitMQ = matchMedia('(min-width: 600px) and (max-width: 760px) and (min-height: 700px)');
  function view() {
    if (!splitMQ.matches) {
      root.style.removeProperty('--win-w'); root.style.removeProperty('--win-h');
      return { w: innerWidth, h: innerHeight, x: 0 };
    }
    var x = parseFloat(getComputedStyle(root).getPropertyValue('--rail-mini')) || 72;
    root.style.setProperty('--win-w', (innerWidth - x) + 'px'); root.style.setProperty('--win-h', innerHeight + 'px');
    return { w: innerWidth - x, h: innerHeight, x: x };
  }
  // The open app: full screen, or the whole pane beside the rail.
  function placeOpen() {
    var v = view();
    root.style.setProperty('--va', v.w + ' / ' + v.h);
    root.style.setProperty('--var', String(v.w / v.h));
    root.style.setProperty('--card', v.x ? 'translate(' + v.x + 'px,0px)' : 'none'); root.style.setProperty('--card-r', '0px');
  }

  // Map the window onto the card slot with one transform.
  function placeCard() {
    var v = view();
    root.style.setProperty('--va', v.w + ' / ' + v.h);
    root.style.setProperty('--var', String(v.w / v.h));
    var r = slot.getBoundingClientRect(), s = r.width / v.w, ch = v.h * s;
    root.style.setProperty('--card', 'translate(' + r.left + 'px,' + r.top + 'px) scale(' + s + ')');
    root.style.setProperty('--card-r', (20 / s) + 'px');
    Object.assign(cardHit.style, { left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: ch + 'px' });
    Object.assign(reflect.style, { left: (r.left + r.width * .1) + 'px', top: (r.top + ch * .85) + 'px', width: (r.width * .8) + 'px', height: (r.width * .25) + 'px' });
  }

  function select(id, opts) {
    if (!APPS[id] || (sel === id && !(opts && opts.force))) return;
    sel = id;
    var a = APPS[id];
    buttons.forEach(function (b) { var on = b.dataset.app === id; b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); if (on && b.scrollIntoView) b.scrollIntoView({ block: 'nearest', inline: 'center', behavior: reducedMQ.matches ? 'auto' : 'smooth' }); });

    root.style.setProperty('--tint', a.tint);
    root.style.setProperty('--wash', a.wash);
    $('kind').textContent = a.kind; $('title').textContent = a.name; $('pitch').textContent = a.pitch;
    $('chips').innerHTML = ''; a.chips.forEach(function (c) { var s = document.createElement('span'); s.textContent = c; $('chips').appendChild(s); });
    $('ghost').href = a.url; $('start').setAttribute('aria-label', 'Start ' + a.name); cardHit.setAttribute('aria-label', 'Open ' + a.name);
    heroEl.classList.remove('swap'); void heroEl.offsetWidth; heroEl.classList.add('swap');
    // the new pitch can change the hero's height, which moves the slot in the split view
    if (!open) placeCard();
    $('winIcon').src = a.icon; $('winName').textContent = a.name; $('newTab').href = a.url;
    $('splashIcon').src = a.icon;
    var fr = warm(id);
    Object.keys(frames).forEach(function (k) { frames[k].el.classList.toggle('active', k === id); });
    splash.classList.toggle('gone', fr.loaded);
    if (fr.loaded) warmNeighbours(); else fr.waiters.push(warmNeighbours);
  }

  buttons.forEach(function (b) {
    var id = b.dataset.app;
    if (fine) b.addEventListener('mouseenter', function () { if (!open) select(id); });
    b.addEventListener('focus', function () { if (!open) select(id); });
    // With a mouse, hovering already selected it, so a click starts it. On touch, the first tap selects.
    b.addEventListener('click', function () { if (open) { if (id !== open) switchTo(id); return; } if (sel === id && (fine || b.dataset.tapped)) launch(id); else { select(id); buttons.forEach(function (x) { delete x.dataset.tapped; }); b.dataset.tapped = '1'; } });
  });
  $('start').addEventListener('click', function () { launch(sel); });
  cardHit.addEventListener('click', function () { launch(sel); });

  function launch(id, opts) {
    opts = opts || {};
    if (open || busy || !APPS[id]) return;
    select(id);
    open = id; busy = true;
    var reduce = reducedMQ.matches || opts.instant;
    if (!opts.fromHistory) { history.pushState({ app: id }, '', '#' + id); pushed = true; }
    if (reduce) win.classList.add('instant');
    win.classList.remove('preview'); win.removeAttribute('aria-hidden');
    document.body.classList.add('app-open');
    placeOpen();
    var fr = frames[id];
    fr.el.tabIndex = 0; $('homeBtn').tabIndex = 0; $('newTab').tabIndex = 0; dots.forEach(function (d) { d.tabIndex = 0; });
    setTimeout(function () {
      win.classList.remove('instant'); busy = false;
      var go = function () { splash.classList.add('gone'); try { fr.el.focus(); } catch (e) {} };
      if (fr.loaded) go(); else { fr.waiters.push(go); setTimeout(go, 2500); }
    }, reduce ? 0 : DUR);
  }

  function home(opts) {
    opts = opts || {};
    if (!open) return;
    // Leave through history when we came in through it, so Back and the button agree.
    if (!opts.fromHistory && pushed) { history.back(); return; }
    var id = open, reduce = reducedMQ.matches;
    busy = true;
    if (reduce) win.classList.add('instant');
    frames[id].el.tabIndex = -1; $('homeBtn').tabIndex = -1; $('newTab').tabIndex = -1; dots.forEach(function (d) { d.tabIndex = -1; });
    win.classList.add('preview'); win.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('app-open');
    placeCard();
    setTimeout(function () {
      win.classList.remove('instant'); open = null; busy = false; pushed = false;
      var b = buttons.find(function (x) { return x.dataset.app === id; }); b.focus({ preventScroll: true });
    }, reduce ? 0 : DUR);
  }
  $('homeBtn').addEventListener('click', function () { home(); });

  // Swap the open app for another one without going home: the new one slides in from the
  // side it was swiped from. The URL follows (#id) without adding a history entry, so Back
  // still means "launcher".
  function switchTo(id, dir) {
    if (!open || busy || id === open || !APPS[id]) return;
    var prev = frames[open];
    if (!dir) dir = order.indexOf(id) > order.indexOf(open) ? 1 : -1;
    busy = true;
    prev.el.tabIndex = -1;
    select(id, { force: true });
    open = id;
    history.replaceState({ app: id }, '', '#' + id);
    var fr = frames[id];
    fr.el.tabIndex = 0;
    if (!reducedMQ.matches && fr.el.animate) {
      var opts = { duration: 380, easing: 'cubic-bezier(.32,.72,0,1)' };
      fr.el.animate([{ transform: 'translateX(' + dir * 28 + '%)', opacity: 0 }, { transform: 'none', opacity: 1 }], opts);
      prev.el.animate([{ transform: 'none', opacity: 1 }, { transform: 'translateX(' + -dir * 28 + '%)', opacity: 0 }], opts);
      splash.animate([{ transform: 'translateX(' + dir * 28 + '%)' }, { transform: 'none' }], opts);
    }
    setTimeout(function () {
      busy = false;
      var go = function () { if (open === id) { splash.classList.add('gone'); try { fr.el.focus(); } catch (e) {} } };
      if (fr.loaded) go(); else fr.waiters.push(go);
    }, reducedMQ.matches ? 0 : 380);
  }
  function step(dir) {
    var cur = open || sel, n = order.length;
    if (n < 2) return;
    var next = order[(order.indexOf(cur) + dir + n) % n];
    if (open) switchTo(next, dir); else select(next);
  }

  // Swipe: on the home screen anywhere, and in an app on its top bar (the app itself keeps
  // its own drags, like spinning a globe). Swipe left for the next app, right for the previous.
  var touch = null, swipedAt = 0;
  addEventListener('touchstart', function (e) {
    if (busy || e.touches.length !== 1) { touch = null; return; }
    var t = e.target, onBar = t.closest && t.closest('.bar');

    touch = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() };
  }, { passive: true });
  addEventListener('touchend', function (e) {
    if (!touch) return;
    var dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y, quick = Date.now() - touch.t < 800;
    touch = null;
    if (quick && Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) { swipedAt = Date.now(); step(dx < 0 ? 1 : -1); }
  }, { passive: true });

  // a swipe that ends on a button shouldn't also press it
  document.addEventListener('click', function (e) { if (Date.now() - swipedAt < 450) { e.preventDefault(); e.stopPropagation(); } }, true);
  // two-finger sideways scroll on a trackpad does the same on the home screen
  var wheelSum = 0, wheelQuiet = 0;
  addEventListener('wheel', function (e) {
    if (open || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    var now = Date.now();
    if (now < wheelQuiet) return;
    wheelSum += e.deltaX;
    if (Math.abs(wheelSum) > 80) { step(wheelSum > 0 ? 1 : -1); wheelSum = 0; wheelQuiet = now + 500; }
  }, { passive: true });

  addEventListener('popstate', function (e) {
    var want = e.state && e.state.app;
    if (open && !want) home({ fromHistory: true });
    else if (!open && want) { pushed = true; launch(want, { fromHistory: true }); }
  });
  addEventListener('hashchange', function () { var id = location.hash.slice(1); if (!open && APPS[id]) { history.replaceState(null, '', location.pathname); launch(id); } });
  addEventListener('resize', function () {
    if (open) { win.classList.add('instant'); placeOpen(); requestAnimationFrame(function () { win.classList.remove('instant'); }); return; }
    win.classList.add('instant'); placeCard(); requestAnimationFrame(function () { win.classList.remove('instant'); });
  });

  addEventListener('keydown', function (e) {
    if (open) { if (e.key === 'Escape') home(); return; }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { step(1); buttons[order.indexOf(sel)].focus({ preventScroll: true }); e.preventDefault(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { step(-1); buttons[order.indexOf(sel)].focus({ preventScroll: true }); e.preventDefault(); }
    else if (e.key === 'Enter' && !(document.activeElement && document.activeElement.closest && document.activeElement.closest('.actions, .app, .card-hit'))) { launch(sel); e.preventDefault(); }
  });

  // An app loading behind the home screen can focus one of its own fields, which would
  // take the arrow keys away from the launcher. On the home screen, take focus back.
  addEventListener('blur', function () {
    setTimeout(function () {
      var f = document.activeElement;
      if (!open && f && f.tagName === 'IFRAME' && f.closest('#frames')) { f.blur(); buttons[order.indexOf(sel)].focus({ preventScroll: true }); }
    });
  });

  // the background wash follows the pointer a little
  if (fine && !reducedMQ.matches) addEventListener('pointermove', function (e) {
    root.style.setProperty('--mx', (50 + (e.clientX / innerWidth - .5) * 30) + '%');
    root.style.setProperty('--my', (40 + (e.clientY / innerHeight - .5) * 20) + '%');
  }, { passive: true });

  try { if (!sessionStorage.getItem('booted') && !reducedMQ.matches) { document.body.classList.add('booting'); sessionStorage.setItem('booted', '1'); setTimeout(function () { document.body.classList.remove('booting'); }, 2100); } } catch (e) {}

  placeCard();
  var start = location.hash.slice(1);
  select(APPS[start] ? start : order[0], { force: true });
  requestAnimationFrame(function () { win.classList.remove('instant'); });
  // A link straight to an app (#gridline) opens it, with the launcher one Back away.
  if (APPS[start]) { history.replaceState(null, '', location.pathname); launch(start, { instant: true }); }

  // Once the selected app is in, load its neighbours in the background, so the next swipe
  // or arrow lands on an app that's already running. Only neighbours: with many apps,
  // loading all of them at once would be too much for a phone.
  function warmNeighbours() {

    var idle = window.requestIdleCallback || function (fn) { return setTimeout(fn, 1200); };
    var n = order.length, i = order.indexOf(open || sel);
    if (lean || n < 2 || i < 0) return;

    (function next() {
      var id = queue.shift(); if (!id) return;
      idle(function () { var fr = warm(id); if (fr.loaded) next(); else fr.waiters.push(next); }, { timeout: 3000 });
    })();
  }

  function tick() { var d = new Date(); $('clock').innerHTML = '<span class="d">' + d.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' }) + '&nbsp; </span>' + d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
  tick(); setInterval(tick, 15000);

  // drifting light waves, tinted with the selected app's colour; paused while an app is open
  var c = $('waves'), x = c.getContext('2d'), t = 0, w, h, dpr, rgb = [127, 167, 255];
  function size() { dpr = Math.min(devicePixelRatio || 1, 2); w = innerWidth; h = innerHeight; c.width = w * dpr; c.height = h * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); }
  size(); addEventListener('resize', size);
  function hex(s) { return [1, 3, 5].map(function (i) { return parseInt(s.slice(i, i + 2), 16); }); }
  function frame() {
    if (open) { setTimeout(frame, 400); return; }
    var target = hex(APPS[sel] ? APPS[sel].tint : '#7FA7FF');
    rgb = rgb.map(function (v, i) { return v + (target[i] - v) * .04; });
    var g = x.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, '#070A14'); g.addColorStop(1, 'rgb(' + rgb.map(function (v) { return Math.round(v * .14); }).join(',') + ')');
    x.fillStyle = g; x.fillRect(0, 0, w, h);
    var col = rgb.map(Math.round).join(',');
    for (var k = 0; k < 5; k++) {
      x.beginPath();
      for (var px = 0; px <= w; px += 8) {
        var y = h * (.66 + k * .04) + Math.sin(px / (260 + k * 70) + t * (0.6 + k * .15) + k) * (26 + k * 10) + Math.sin(px / 120 + t * 1.3 + k * 2) * 6;
        px === 0 ? x.moveTo(px, y) : x.lineTo(px, y);
      }
      x.strokeStyle = 'rgba(' + col + ',' + (0.34 - k * 0.055) + ')';
      x.lineWidth = 1.2 + (4 - k) * .5;
      x.shadowColor = 'rgba(' + col + ',.7)'; x.shadowBlur = 14;
      x.stroke();
    }
    x.shadowBlur = 0;
    if (!reducedMQ.matches) t += 0.008;
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
