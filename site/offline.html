<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline · bollineni.co</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* Shown by the service worker when an installed app opens without a connection.
   Self-contained: no web fonts or files, so it renders with the network down.
   Same look as the launcher: black ground, white type, square corners. */
:root { --night: #000; --ink: #fff; --muted: #A8A8A8; --red: #D62E1F; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night); color: var(--ink);
  font: 400 17px/1.55 "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
  display: grid; place-items: center;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
main { max-width: 380px; display: grid; gap: 14px; justify-items: start; }
h1 { font-size: 34px; font-weight: 900; line-height: 1; margin: 0; letter-spacing: -.04em; }
p { margin: 0; color: var(--muted); }
button { margin-top: 10px; min-height: 48px; padding: 0 22px; font: inherit; font-weight: 800; font-size: 16px; line-height: 1; color: var(--night); background: var(--ink); border: 2px solid var(--ink); border-radius: 0; cursor: pointer; }
button:hover { background: var(--red); border-color: var(--red); color: var(--ink); }
button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>This app needs a connection. Your saved work is still on this device and will be here when you're back online.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
