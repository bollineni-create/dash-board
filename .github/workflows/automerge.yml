# Merges a pull request on its own once Cursor has approved it and every check and status has passed.
# Cursor reviews each PR (Bugbot, the security reviewer and the approval agent). If it asks
# for changes or pushes a fix, nothing merges until it approves the newest commit.
name: Auto-merge after Cursor approves
# Every trigger runs the copy of this file on the default branch, never a PR's own copy,
# so a PR cannot edit this workflow to merge itself. Cursor's approval agent reports a
# check suite when it approves, which is what wakes this up after an approval.
on:
  pull_request_target:
    types: [ready_for_review]
  check_suite:
    types: [completed]
  status: {}
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
concurrency:
  group: auto-merge
  cancel-in-progress: false
jobs:
  auto-merge:
    runs-on: ubuntu-latest
    env:
      # Checks or statuses that must have reported success on the PR's newest commit.
      # Missing ones count as pending, so nothing merges before they have run.
      REQUIRED_CHECKS: "Vercel, Cursor Bugbot, Cursor Security Agent: Security Reviewer"
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const OK = ['success', 'neutral', 'skipped'];
            const REQUIRED = (process.env.REQUIRED_CHECKS || '').split(',').map((n) => n.trim()).filter(Boolean);
            // Never check out or run the PR's code here: this job holds a write token.
            const candidates = context.payload.pull_request
              ? [context.payload.pull_request]
              : await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            for (const { number } of candidates) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pr.state !== 'open' || pr.draft || pr.base.ref !== pr.base.repo.default_branch) continue;
              if (pr.head.repo.full_name !== `${owner}/${repo}`) continue; // never merge forks
              const sha = pr.head.sha;

              // Cursor's latest verdict must be an approval of the newest commit.
              const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number, per_page: 100 });
              const verdict = reviews.filter((r) => r.user?.login === 'cursor[bot]' && ['APPROVED', 'CHANGES_REQUESTED'].includes(r.state)).pop();
              if (!verdict || verdict.state !== 'APPROVED' || verdict.commit_id !== sha) {
                core.info(`#${number}: waiting for Cursor to approve ${sha.slice(0, 7)}`);
                continue;
              }

              // Every other check on that commit must have finished green.
              const runs = (await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: sha, per_page: 100 }))
                .filter((r) => r.name !== 'auto-merge');
              const pending = runs.filter((r) => r.status !== 'completed').map((r) => r.name);
              const failed = runs.filter((r) => r.status === 'completed' && !OK.includes(r.conclusion)).map((r) => r.name);
              // Commit statuses too (Vercel reports its preview deployment this way).
              const { data: combined } = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: sha });
              for (const s of combined.statuses) {
                if (s.state === 'pending') pending.push(s.context);
                else if (s.state !== 'success') failed.push(s.context);
              }
              // Required gates that have not reported yet are pending, never a pass.
              const reported = new Set([...runs.map((r) => r.name), ...combined.statuses.map((s) => s.context)]);
              for (const name of REQUIRED) if (!reported.has(name)) pending.push(`${name} (not started)`);
              if (!runs.length && !combined.statuses.length) pending.push('no checks reported yet');
              if (pending.length || failed.length) {
                core.info(`#${number}: pending [${pending.join(', ')}] failed [${failed.join(', ')}]`);
                continue;
              }
              if (pr.mergeable === false) {
                core.warning(`#${number}: has a merge conflict, not merging`);
                continue;
              }

              // One PR failing to merge (a conflict, a race) must not stop the others.
              try {
                await github.rest.pulls.merge({ owner, repo, pull_number: number, merge_method: 'squash', sha });
                core.notice(`Merged #${number} (${pr.title})`);
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` }).catch(() => {});
              } catch (err) {
                core.warning(`#${number}: merge failed: ${err.message}`);
              }
            }
